spring.application.name=pmc-water-tracker

# --- Default dev database: in-memory H2, no setup required ---------------
# Resets on every restart and reloads from data.sql. Good for local dev and
# for trying the project out. Swap to the MySQL block below for anything
# you want to persist or edit through the admin endpoints long-term.
spring.datasource.url=jdbc:h2:mem:pmcwater;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# --- Production: MySQL (matches a typical CF + MySQL DBaaS setup) --------
# Comment out the H2 block above and uncomment this one. With ddl-auto=update
# your schema is created once and then preserved across restarts, and
# data.sql only needs spring.sql.init.mode=never so it doesn't re-seed
# (or use always once, then switch to never after the first run).
#
# spring.datasource.url=jdbc:mysql://<host>:3306/pmc_water_tracker?useSSL=true&serverTimezone=UTC
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.sql.init.mode=never
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
