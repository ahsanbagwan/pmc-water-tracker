spring.application.name=pmc-water-tracker
server.port=8080

# Default profile if none is set (local dev): H2 in-memory, zero setup.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Initial admin account -------------------------------------------------
# Created automatically on first startup (only if no users exist yet).
# This default is ONLY for local dev -- on Render (or anywhere public), set
# ADMIN_USERNAME and ADMIN_PASSWORD env vars to real values. Don't deploy
# with these defaults in place; they're sitting here in plain text in a
# public repo.
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:change-me-now}

# --- JWT signing secret ----------------------------------------------------
# Used to sign/verify login tokens. This default is ONLY for local dev -- on
# Render (or anywhere public), set a real random JWT_SECRET (32+ chars, e.g.
# `openssl rand -base64 48`). The app refuses to start under the prod profile
# if this default is still in place.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-change-in-prod-0123456789}
# Token lifetime in ms -- defaults to 12 hours. After this, users need to log in again.
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:43200000}

# --- RabbitMQ (optional) ----------------------------------------------------
# Disabled by default -- the app runs fine with no broker at all until you set this up.
# Set RABBITMQ_ENABLED=true plus the connection vars below once you have a broker
# (e.g. CloudAMQP's free tier, or Aiven if they offer RabbitMQ on your plan).
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- Email notifications ----------------------------------------------------
# Used by ReportNotificationListener to email you when a citizen submits a report.
# Only fires if RabbitMQ is also enabled above, and only sends if both MAIL_USERNAME
# and ADMIN_NOTIFICATION_EMAIL are set -- otherwise it logs a warning and skips silently
# rather than failing report submission.
#
# Defaults assume Gmail SMTP with an App Password (not your normal Gmail password --
# generate one at https://myaccount.google.com/apppasswords, requires 2FA enabled on
# the account). Any SMTP provider works -- just change MAIL_HOST/MAIL_PORT to match.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:}

# No OTel collector running locally -- avoid noisy connection-refused log spam
management.otlp.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
